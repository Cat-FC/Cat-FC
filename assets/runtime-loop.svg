<svg width="1000" height="430" viewBox="0 0 1000 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="ring" x1="165" y1="215" x2="835" y2="215">
      <stop stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#84CC16"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1000" height="430" rx="30" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="997" height="427" rx="28.5" stroke="#334155" stroke-width="3"/>
  <g opacity=".18">
    <circle cx="500" cy="215" r="186" stroke="#38BDF8"/>
    <circle cx="500" cy="215" r="132" stroke="#84CC16"/>
    <circle cx="500" cy="215" r="78" stroke="#F59E0B"/>
  </g>
  <path id="loopPath" d="M500 61C681 61 835 129 835 215S681 369 500 369 165 301 165 215 319 61 500 61Z" stroke="url(#ring)" stroke-width="5" stroke-linecap="round" stroke-dasharray="30 20" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="220" to="0" dur="3.2s" repeatCount="indefinite"/>
  </path>
  <g filter="url(#glow)">
    <circle r="10" fill="#22D3EE">
      <animateMotion dur="4s" repeatCount="indefinite" path="M500 61C681 61 835 129 835 215S681 369 500 369 165 301 165 215 319 61 500 61Z"/>
    </circle>
    <circle r="8" fill="#84CC16">
      <animateMotion dur="4s" begin="-1.3s" repeatCount="indefinite" path="M500 61C681 61 835 129 835 215S681 369 500 369 165 301 165 215 319 61 500 61Z"/>
    </circle>
    <circle r="8" fill="#F59E0B">
      <animateMotion dur="4s" begin="-2.6s" repeatCount="indefinite" path="M500 61C681 61 835 129 835 215S681 369 500 369 165 301 165 215 319 61 500 61Z"/>
    </circle>
  </g>
  <g font-family="Consolas, JetBrains Mono, monospace" font-weight="800" text-anchor="middle">
    <rect x="390" y="174" width="220" height="82" rx="18" fill="#0F172A" stroke="#22D3EE" stroke-width="2"/>
    <text x="500" y="207" fill="#F8FAFC" font-size="23">Runtime Loop</text>
    <text x="500" y="235" fill="#A7F3D0" font-size="15">ship useful systems</text>
    <g font-size="17">
      <text x="500" y="45" fill="#BAE6FD">designSystem()</text>
      <text x="850" y="221" fill="#D9F99D">buildBackend()</text>
      <text x="500" y="404" fill="#FDE68A">connectTools()</text>
      <text x="150" y="221" fill="#DDD6FE">shipAgentWorkflow()</text>
    </g>
  </g>
  <g opacity=".85">
    <rect x="92" y="88" width="126" height="34" rx="8" fill="#082F49" stroke="#22D3EE"/>
    <rect x="782" y="88" width="126" height="34" rx="8" fill="#1E1B4B" stroke="#8B5CF6"/>
    <rect x="92" y="308" width="126" height="34" rx="8" fill="#052E16" stroke="#84CC16"/>
    <rect x="782" y="308" width="126" height="34" rx="8" fill="#451A03" stroke="#F59E0B"/>
    <animate attributeName="opacity" values=".45;1;.45" dur="2.2s" repeatCount="indefinite"/>
  </g>
  <g font-family="Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">
    <text x="155" y="110" fill="#E0F2FE">Java</text>
    <text x="845" y="110" fill="#EDE9FE">Agent</text>
    <text x="155" y="330" fill="#DCFCE7">RAG</text>
    <text x="845" y="330" fill="#FEF3C7">MCP</text>
  </g>
</svg>
